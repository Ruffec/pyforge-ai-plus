name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Import Windows certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $encodedCert = "${{ secrets.WINDOWS_CERTIFICATE }}"
          if ([string]::IsNullOrWhiteSpace($encodedCert)) {
            Write-Host "WINDOWS_CERTIFICATE secret not set; skipping import."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows_certificate.pfx"
          [Convert]::FromBase64String($encodedCert) | Set-Content -Path $certPath -Encoding Byte
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -Force -AsPlainText
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Write-Host "Imported Windows certificate."

      - name: Import Apple certificate
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE secret not set; skipping import."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/apple_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PyForge AI ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install PyForge AI.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Sign Linux packages (optional)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY secret not set; skipping Linux GPG signing."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          for f in src-tauri/target/release/bundle/*.{AppImage,deb,rpm}; do
            [ -e "$f" ] || continue
            gpg --batch --yes --armor --detach-sign \
              --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback "$f"
          done

      - name: Upload Linux GPG signatures
        if: matrix.platform == 'linux'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: src-tauri/target/release/bundle/*.asc
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false

  publish-updater-json:
    name: Publish updater JSON
    runs-on: ubuntu-latest
    needs: build-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate updater JSON
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_STR="${VERSION#v}"
          cat > pyforge-ai-updates.json <<EOF
          {
            "version": "${VERSION_STR}",
            "notes": "PyForge AI ${VERSION} release.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "signature": "<PLACEHOLDER_SIGNATURE>",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PyForge_AI_${VERSION_STR}_x64-setup.exe"
          }
          EOF

      - name: Upload updater JSON to release
        uses: softprops/action-gh-release@v2
        with:
          files: pyforge-ai-updates.json
          tag_name: ${{ github.ref_name }}
          body: |
            Updater metadata JSON has been attached to this release.

            ⚠️ Before publishing, replace `<PLACEHOLDER_SIGNATURE>` in `pyforge-ai-updates.json`
            with the actual minisign signature from the signed installer asset, then re-upload
            the file to your actual update server (or update the release asset).
