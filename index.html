<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyForge AI</title>
    <style>
      /* 主题感知的启动背景，避免首帧闪烁；默认明亮主题 */
      html { background-color: #ffffff; }
      html.dark { background-color: #0a0e14; }
      body { margin: 0; padding: 0; }

      /* ============================================================
       * 启动骨架屏（React 挂载前首帧即渲染，消除窗口空白期）
       * 颜色与 design/colors_and_type.css 的设计令牌保持一致，
       * React createRoot 渲染后 #root 内容被整体替换，无需手动卸载。
       * ============================================================ */
      .pf-sk {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        color: #0d1117;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        pointer-events: none;
      }
      html.dark .pf-sk {
        background: #0a0e14;
        color: #e6edf3;
      }
      .pf-sk-topbar {
        height: 48px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: #ffffff;
        border-bottom: 1px solid #d0d7de;
      }
      html.dark .pf-sk-topbar {
        background: #0a0e14;
        border-bottom-color: #21262d;
      }
      .pf-sk-logo {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: #0d9488;
        flex: none;
      }
      html.dark .pf-sk-logo { background: #2dd4bf; }
      .pf-sk-bar {
        height: 10px;
        border-radius: 5px;
        background: #e6edf3;
      }
      html.dark .pf-sk-bar { background: #21262d; }
      .pf-sk-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .pf-sk-sidebar {
        width: 240px;
        flex: none;
        background: #f6f8fa;
        border-right: 1px solid #d0d7de;
        padding: 12px 10px;
        display: none;
        flex-direction: column;
        gap: 4px;
      }
      html.dark .pf-sk-sidebar {
        background: #0a0e14;
        border-right-color: #21262d;
      }
      @media (min-width: 1024px) { .pf-sk-sidebar { display: flex; } }
      .pf-sk-nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
      }
      .pf-sk-nav-item.active { background: #e6edf3; }
      html.dark .pf-sk-nav-item.active { background: #161b22; }
      .pf-sk-dot {
        width: 16px;
        height: 16px;
        border-radius: 5px;
        flex: none;
        background: #c9d1d9;
      }
      html.dark .pf-sk-dot { background: #30363d; }
      .pf-sk-nav-item.active .pf-sk-dot { background: #0d9488; }
      html.dark .pf-sk-nav-item.active .pf-sk-dot { background: #2dd4bf; }
      .pf-sk-main {
        flex: 1;
        min-width: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow: hidden;
      }
      @media (min-width: 640px) { .pf-sk-main { padding: 24px; } }
      .pf-sk-banner {
        height: 96px;
        border-radius: 12px;
        border: 1px solid #d0d7de;
        border-left: 4px solid #0d9488;
        background: #ffffff;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      html.dark .pf-sk-banner {
        border-color: #21262d;
        border-left-color: #2dd4bf;
        background: #0d1117;
      }
      .pf-sk-cards {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 640px) { .pf-sk-cards { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 1280px) { .pf-sk-cards { grid-template-columns: repeat(4, 1fr); } }
      .pf-sk-card {
        height: 108px;
        border-radius: 12px;
        border: 1px solid #d0d7de;
        background: #f6f8fa;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      html.dark .pf-sk-card {
        border-color: #21262d;
        background: #0d1117;
      }
      .pf-sk-panels {
        flex: 1;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
        min-height: 120px;
      }
      @media (min-width: 1024px) { .pf-sk-panels { grid-template-columns: 3fr 2fr; } }
      .pf-sk-panel {
        border-radius: 12px;
        border: 1px solid #d0d7de;
        background: #ffffff;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      html.dark .pf-sk-panel {
        border-color: #21262d;
        background: #0d1117;
      }
      /* 微光扫过动画：弱化处理，仅指示「加载中」，数据就绪后整体被替换 */
      .pf-sk-shine { position: relative; overflow: hidden; }
      .pf-sk-shine::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(13, 148, 136, 0.07), transparent);
        animation: pf-sk-sweep 1.6s ease-in-out infinite;
      }
      html.dark .pf-sk-shine::after {
        background: linear-gradient(90deg, transparent, rgba(45, 212, 191, 0.08), transparent);
      }
      @keyframes pf-sk-sweep { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        .pf-sk-shine::after { animation: none; }
      }
    </style>
    <script>
      // React 挂载前同步已保存的主题，防止首帧主题闪烁
      (function () {
        try {
          var mode = localStorage.getItem('pyforge-theme');
          if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* localStorage 不可用时保持默认明亮主题 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 启动骨架屏：与 App 布局（TopBar 48px + 240px 侧栏 + 内容区）一致 -->
      <div class="pf-sk" aria-hidden="true">
        <div class="pf-sk-topbar">
          <div class="pf-sk-logo"></div>
          <div class="pf-sk-bar" style="width:120px"></div>
          <div style="flex:1"></div>
          <div class="pf-sk-bar" style="width:64px"></div>
          <div class="pf-sk-bar" style="width:64px"></div>
        </div>
        <div class="pf-sk-body">
          <div class="pf-sk-sidebar">
            <div class="pf-sk-nav-item active"><div class="pf-sk-dot"></div><div class="pf-sk-bar pf-sk-shine" style="width:72px"></div></div>
            <div class="pf-sk-nav-item"><div class="pf-sk-dot"></div><div class="pf-sk-bar" style="width:88px"></div></div>
            <div class="pf-sk-nav-item"><div class="pf-sk-dot"></div><div class="pf-sk-bar" style="width:64px"></div></div>
            <div class="pf-sk-nav-item"><div class="pf-sk-dot"></div><div class="pf-sk-bar" style="width:80px"></div></div>
            <div class="pf-sk-nav-item"><div class="pf-sk-dot"></div><div class="pf-sk-bar" style="width:72px"></div></div>
            <div class="pf-sk-nav-item"><div class="pf-sk-dot"></div><div class="pf-sk-bar" style="width:56px"></div></div>
          </div>
          <div class="pf-sk-main">
            <div class="pf-sk-banner">
              <div class="pf-sk-bar pf-sk-shine" style="width:96px;height:14px"></div>
              <div class="pf-sk-bar" style="width:280px;max-width:70%"></div>
            </div>
            <div class="pf-sk-cards">
              <div class="pf-sk-card"><div class="pf-sk-bar" style="width:64px"></div><div class="pf-sk-bar pf-sk-shine" style="width:48px;height:18px"></div></div>
              <div class="pf-sk-card"><div class="pf-sk-bar" style="width:64px"></div><div class="pf-sk-bar pf-sk-shine" style="width:48px;height:18px"></div></div>
              <div class="pf-sk-card"><div class="pf-sk-bar" style="width:64px"></div><div class="pf-sk-bar pf-sk-shine" style="width:48px;height:18px"></div></div>
              <div class="pf-sk-card"><div class="pf-sk-bar" style="width:64px"></div><div class="pf-sk-bar pf-sk-shine" style="width:48px;height:18px"></div></div>
            </div>
            <div class="pf-sk-panels">
              <div class="pf-sk-panel">
                <div class="pf-sk-bar pf-sk-shine" style="width:112px"></div>
                <div class="pf-sk-bar" style="width:88%"></div>
                <div class="pf-sk-bar" style="width:76%"></div>
                <div class="pf-sk-bar" style="width:82%"></div>
              </div>
              <div class="pf-sk-panel">
                <div class="pf-sk-bar pf-sk-shine" style="width:96px"></div>
                <div class="pf-sk-bar" style="width:84%"></div>
                <div class="pf-sk-bar" style="width:70%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8b949e;font-family:system-ui;">
        PyForge AI 需要启用 JavaScript 才能运行
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
