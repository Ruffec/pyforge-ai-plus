<!doctype html>
<html lang="zh" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preflight</title>
    <style id="theme-vars">
      /* ==========================================================================
   PyForge AI — Brand Design Tokens
   Dark Developer Theme · Teal-Cyan Primary · AI-Forward
   ========================================================================== */

      /* --------------------------------------------------------------------------
   Brand Prefix: pf
   Default = Light Mode · .dark = Dark Mode (primary design)
   -------------------------------------------------------------------------- */
      :root {
        /* ---- Primary Scale (Teal-Cyan) ---- */
        --pf-primary-50: #ecfdfb;
        --pf-primary-100: #cffeed;
        --pf-primary-200: #9ff8dd;
        --pf-primary-300: #5fecce;
        --pf-primary-400: #2dd4bf;
        --pf-primary-500: #14b8a6;
        --pf-primary-600: #0d9488;
        --pf-primary-700: #0f766e;
        --pf-primary-800: #115e56;
        --pf-primary-900: #134e48;

        /* ---- Neutral Scale ---- */
        --pf-neutral-50: #f6f8fa;
        --pf-neutral-100: #e6edf3;
        --pf-neutral-200: #c9d1d9;
        --pf-neutral-300: #8b949e;
        --pf-neutral-400: #6e7681;
        --pf-neutral-500: #484f58;
        --pf-neutral-600: #30363d;
        --pf-neutral-700: #21262d;
        --pf-neutral-800: #161b22;
        --pf-neutral-900: #0d1117;
        --pf-neutral-950: #0a0e14;

        /* ---- Semantic Aliases (Light Mode Default) ---- */
        --pf-background: #ffffff;
        --pf-foreground: #0d1117;
        --pf-card: #f6f8fa;
        --pf-card-foreground: #0d1117;
        --pf-popover: #ffffff;
        --pf-popover-foreground: #0d1117;
        --pf-primary: #0d9488;
        --pf-primary-foreground: #ffffff;
        --pf-muted: #f6f8fa;
        --pf-muted-foreground: #6e7681;
        --pf-border: #d0d7de;
        --pf-input: #d0d7de;
        --pf-ring: #0d9488;

        /* ---- Radius Scale ---- */
        --pf-radius-small: 4px;
        --pf-radius-medium: 8px;
        --pf-radius-large: 12px;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-full: 9999px;

        /* ---- State Colors ---- */
        --state-success: #1a7f37;
        --state-warning: #9a6700;
        --state-error: #cf222e;
        --state-info: #0969da;

        /* ---- Typography ---- */
        --pf-font-sans:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --pf-font-mono:
          'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Consolas, monospace;

        /* ---- Surface Depth ---- */
        --pf-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
        --pf-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
        --pf-shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.06);

        /* ---- Sidebar ---- */
        --pf-sidebar-bg: #f6f8fa;
        --pf-sidebar-item: #6e7681;
        --pf-sidebar-item-active: #0d9488;
        --pf-sidebar-item-hover: #e6edf3;
      }

      /* --------------------------------------------------------------------------
   Dark Mode (Primary Design)
   -------------------------------------------------------------------------- */
      :root.dark {
        --pf-background: #0a0e14;
        --pf-foreground: #e6edf3;
        --pf-card: #0d1117;
        --pf-card-foreground: #e6edf3;
        --pf-popover: #161b22;
        --pf-popover-foreground: #e6edf3;
        --pf-primary: #2dd4bf;
        --pf-primary-foreground: #0a0e14;
        --pf-muted: #161b22;
        --pf-muted-foreground: #8b949e;
        --pf-border: #21262d;
        --pf-input: #21262d;
        --pf-ring: #2dd4bf;

        --state-success: #3fb950;
        --state-warning: #d29922;
        --state-error: #f85149;
        --state-info: #58a6ff;

        --pf-sidebar-bg: #0a0e14;
        --pf-sidebar-item: #8b949e;
        --pf-sidebar-item-active: #2dd4bf;
        --pf-sidebar-item-hover: #161b22;

        --pf-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
        --pf-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
        --pf-shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.06);
      }

      /* --------------------------------------------------------------------------
   Typography Classes
   -------------------------------------------------------------------------- */
      .pf-text-display {
        font-family: var(--pf-font-sans);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .pf-text-heading {
        font-family: var(--pf-font-sans);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }

      .pf-text-body {
        font-family: var(--pf-font-sans);
        font-weight: 400;
        line-height: 1.6;
      }

      .pf-text-mono {
        font-family: var(--pf-font-mono);
        font-weight: 400;
        letter-spacing: -0.02em;
      }

      .pf-text-label {
        font-family: var(--pf-font-sans);
        font-weight: 500;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        font-size: 0.7rem;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--pf-background);
        --color-foreground: var(--pf-foreground);
        --color-card: var(--pf-card);
        --color-card-foreground: var(--pf-card-foreground);
        --color-popover: var(--pf-popover);
        --color-popover-foreground: var(--pf-popover-foreground);
        --color-primary: var(--pf-primary);
        --color-primary-foreground: var(--pf-primary-foreground);
        --color-muted: var(--pf-muted);
        --color-muted-foreground: var(--pf-muted-foreground);
        --color-border: var(--pf-border);
        --color-input: var(--pf-input);
        --color-ring: var(--pf-ring);
        --radius-sm: var(--pf-radius-small);
        --radius-md: var(--pf-radius-medium);
        --radius-lg: var(--pf-radius-large);
      }
      @layer base {
        body {
          background: var(--pf-background);
          color: var(--pf-foreground);
        }
        td,
        th {
          @apply break-words;
          word-break: break-all;
          word-break: auto-phrase;
        }
        th {
          @apply whitespace-nowrap;
        }
      }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      [data-icon] {
        display: inline-flex;
